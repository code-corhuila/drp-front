<p class="kicker">Pago</p>
<h1>Confirma y paga</h1>
<p class="lead">Un solo cobro por esta reserva.</p>
@if (reservation(); as current) {
  <section class="caja">
    <p class="ticket-id">Reserva {{ current.id }}</p>
    <p>
      {{ space()?.name }}<br />
      {{ formatPeriod(current.startAt, current.endAt) }}
    </p>
    <p class="caja-total">{{ formatCop(amountCents) }}</p>
    <p class="caja-cents">Total en COP</p>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button class="btn" type="button" [disabled]="busy()" (click)="pay()">Pagar</button>
  </section>
}
<p><a class="back" routerLink="/reservations">Ver mis reservas</a></p>
