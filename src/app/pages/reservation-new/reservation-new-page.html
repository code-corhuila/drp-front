<a class="back" [routerLink]="['/spaces', spaceId]" [queryParams]="{ startAt, endAt }">← Volver</a>
<h1>Crear reserva</h1>
@if (space(); as space) {
  <p class="lead">HU-RES-003 · {{ space.name }} · {{ formatPeriod(startAt, endAt) }}</p>
  @if (space.amountCents) {
    <p>{{ formatCop(space.amountCents) }}</p>
  }
}
<p>Estado inicial: <strong>PAYMENT_PENDING</strong>. No se confirma hasta el pago (BR-003).</p>
@if (error()) {
  <p class="error">{{ error() }}</p>
}
<button class="btn sec" type="button" routerLink="/spaces">Volver</button>
<button class="btn" type="button" [disabled]="busy() || !space()" (click)="create()">Confirmar reserva</button>
