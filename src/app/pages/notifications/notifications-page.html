<p class="kicker">Avisos</p>
<h1>Tus avisos</h1>
<p class="lead">Aquí verás las novedades de tus reservas.</p>
@if (error()) {
  <p class="error">{{ error() }}</p>
}
@if (rows().length === 0 && !error()) {
  <p class="lead">Todavía no tienes avisos.</p>
}
@for (row of rows(); track row.id) {
  <article class="bulletin">
    <span class="pin" aria-hidden="true"></span>
    <div>
      <strong>{{ eventLabel(row.eventType) }}</strong>
      <div class="muted">{{ row.createdAt }}</div>
    </div>
    <span [class]="stampClass(row.state)">{{ row.state }}</span>
  </article>
}
