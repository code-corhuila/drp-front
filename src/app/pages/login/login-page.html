<div class="login-wrap">
  <header class="login-bar">
    <strong>SpaceHub</strong>
    <span>DRP</span>
  </header>
  <main class="phone">
    <h1>Entrar</h1>
    <p class="lead">HU-ID-001 · Miembro o administrador SpaceHub</p>
    <form (ngSubmit)="submit()">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="username" required />
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button class="btn" type="submit" [disabled]="busy()">Continuar</button>
    </form>
    <p class="hint">
      Cuentas sintéticas Corte 2:<br />
      <code>member@spacehub.local</code> / <code>Spacehub1!</code> (USER · Ana Reserva)<br />
      <code>admin@spacehub.local</code> / <code>Spacehub1!</code> (ADMIN)
    </p>
  </main>
</div>
