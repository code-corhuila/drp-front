<div class="login-wrap">
  <section class="login-plan" aria-hidden="true">
    <div>
      <p class="kicker" style="color: #f4e0d2">SpaceHub</p>
      <h1>Encuentra un espacio y resérvalo en un minuto.</h1>
      <p>Elige el horario, mira qué está libre y paga en un solo paso.</p>
    </div>
    <div class="campus-grid">
      <span>Puestos</span>
      <span>Salas</span>
      <span>Oficinas</span>
      <span>Aulas</span>
      <span>Auditorios</span>
    </div>
  </section>
  <section class="login-desk">
    <main class="blotter">
      <p class="kicker">Bienvenida</p>
      <h1>Entra a tu cuenta</h1>
      <p class="lead">Usa tu correo y contraseña para reservar.</p>
      <div class="inject-row">
        <app-inject-failure-toggle />
      </div>
      <form (ngSubmit)="submit()">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        <button class="btn" type="submit" [disabled]="busy()">Entrar</button>
      </form>
    </main>
  </section>
</div>
